---
- name: Configure Minecraft server with Docker
  hosts: minecraft
  become: yes

  tasks:
    - name: Stop old manual Minecraft systemd service if it exists
      systemd:
        name: minecraft
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker service
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create Minecraft data directory
      file:
        path: /opt/minecraft-data
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Pull Minecraft Docker image
      command: docker pull itzg/minecraft-server

    - name: Remove existing Minecraft Docker container if it exists
      command: docker rm -f minecraft-server
      ignore_errors: yes

    - name: Run Minecraft server container
      command: >
        docker run -d
        --name minecraft-server
        -p 25565:25565
        -e EULA=TRUE
        -e MEMORY=512M
        -v /opt/minecraft-data:/data
        --restart unless-stopped
        itzg/minecraft-server

    - name: Show running Docker containers
      command: docker ps
      register: docker_ps_output

    - name: Print Docker container output
      debug:
        var: docker_ps_output.stdout_lines
